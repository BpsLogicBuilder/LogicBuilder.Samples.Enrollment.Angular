apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-angular
  namespace: ENROLLMENT_APP_NAMESPACE
  labels:
    app: enrollment-angular
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enrollment-angular
  template:
    metadata:
      labels:
        app: enrollment-angular
    spec:
      nodeSelector:
        workload: apps
      automountServiceAccountToken: false
      serviceAccountName: ENROLLMENT_ANGULAR_SERVICEACCOUNT_NAME
      containers:
      - name: enrollment-angular
        image: ACR_NAME.azurecr.io/enrollmentangular:IMAGE_TAG
        ports:
        - name: angular-http
          containerPort: 8080
        env:
        - name: APPLICATION_CONFIGURATION_ENDPOINT
          value: "APP_CONFIG_ENDPOINT"
        - name: WORKFLOW_URL
          value: "http://enrollment-spa-api.LOAD_BALANCER_IP.nip.io" # NOSONAR - DEV Only
        - name: CRUD_URL
          value: "http://enrollment-api.LOAD_BALANCER_IP.nip.io" # NOSONAR - DEV Only
        - name: GRID_URL
          value: "http://enrollment-kendo-grid-api.LOAD_BALANCER_IP.nip.io" # NOSONAR - DEV Only
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "256Mi"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: angular-http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: angular-http
          initialDelaySeconds: 10
          periodSeconds: 5
