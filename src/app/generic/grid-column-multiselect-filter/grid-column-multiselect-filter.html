<ul>
  @if (showFilter && fieldInputSignal(); as field) {
    <li>
      <label attr.for="{{field}}">{{field}}</label><input id="{{field}}" class="k-textbox" (input)="onInput($event)" />
    </li>
  }
  @for (item of currentData; track item; let i = $index) {
    <li
      (click)="onSelectionChange(valueAccessor(item))"
      (keydown.enter)="onSelectionChange(valueAccessor(item))"
      (keydown.space)="onSelectionChange(valueAccessor(item))"
      [ngClass]="{'k-state-selected': isItemSelected(item)}">
      <input
        type="checkbox"
        id="chk-{{valueAccessor(item)}}"
        class="k-checkbox"
        [checked]="isItemSelected(item)" />
        <label
          class="k-multiselect-checkbox k-checkbox-label"
          for="chk-{{valueAccessor(item)}}">
          {{ textAccessor(item) }}
        </label>
      </li>
    }
  </ul>
