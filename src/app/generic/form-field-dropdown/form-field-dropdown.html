<kendo-dropdownlist
  class="fillparent"
  [data]="dataSignal()" 
  [disabled]="disabled"
  (valueChange)="onChange($event)" 
  [defaultItem]="defaultItem" 
  [value]="selectedValue" 
  [valuePrimitive]="true"
  [textField]="textFieldInputSignal()" 
  [valueField]="valueFieldInputSignal()" >
</kendo-dropdownlist>
