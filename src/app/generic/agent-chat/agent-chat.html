@if (settingsInputSignal(); as settings) {
    <div class="card">
        <div class="card-header bg-primary text-white h6">
            {{settings.title}}
        </div>
        <div class="card-body">
            <kendo-chat 
                #chatContainer
                [authorId]="signalRService.user.id" 
                [messages]="signalRService.messageHistory()"
                (sendMessage)="signalRService.sendMessage($event, settingsInputSignal().signalRConnection.sendMessageToAgentHubMethodName)" 
                [style.height.px]="550" 
                [style.maxWidth.px]="600">

                <ng-template kendoChatMessageTemplate let-message>
                    <div class="k-chat-bubble k-bubble">
                    <div class="k-bubble-content">
                        @if (message.author.id === signalRService.user.id) {
                        <span class="k-chat-bubble-text">{{ message.text }}</span>
                        } @else if (message.typing) {
                        <div class="k-typing-indicator" tabindex="-1"><span></span><span></span><span></span></div>
                        } @else if (message.text) {
                            <div class="markdown-chat-wrapper">
                            <markdown [data]="message.text"></markdown>
                            </div>
                        }
                    </div>
                    </div>
                </ng-template>

            </kendo-chat>
        </div>
        <div class="card-footer">
            @for (button of commandButtonsInputSignal(); track button.id) {
                <button class="btn {{button.classString}} ms-2 px-4 float-right" type="button" (click)="navigateNext(button)">
                    <i class="fa fa-angular {{button.buttonIcon}}"></i> {{button.longString}}
                </button>
            }
        </div>
    </div>
}
